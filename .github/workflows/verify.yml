name: Verify new AR workspace
on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Verify public asset bundle
        run: node scripts/build-connector-deployment.mjs
      - name: Install browser for synthetic smoke tests
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify browser workflows with synthetic APIs
        run: pnpm test:browser:smoke
      - name: Verify background refresh and parallel PDF loading
        run: pnpm exec playwright test --config playwright.performance.config.ts -g 'PDF performance|saved Aging is usable'
      - name: Verify publication polling and continuous Aging
        run: pnpm exec playwright test --config playwright.audit-fixes.config.ts
      - name: Preserve browser failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
