<!doctype html><html><head><meta charset="utf-8"></head><body style="margin:0"><div id="root"></div><script type="module">
import React from 'react';
import {createRoot} from 'react-dom/client';
import {PDFDocument,PDFName,PDFRawStream,decodePDFRawStream,StandardFonts,rgb} from 'pdf-lib';
import {PdfWorkspace} from '/src/pdf/PdfWorkspace.tsx';
import {syntheticStatement} from '/tests/browser/fixtures/statement-pdf.ts';
import * as engine from '/src/pdf/engine.ts';

const params=new URLSearchParams(location.search),hotel=params.get('hotel')??'KAT';

for(const page of pdf.getPages())page.node.delete(PDFName.of('ARVoucherFields'));

 root.render(React.createElement(PdfWorkspace,{key:++mount,documents:sources,initialProject:project,accountName:'Synthetic source deletion test',hotel,selectedCount:2,onClose:()=>{},onSaveDraft:async value=>window.fixture.project=JSON.parse(JSON.stringify(value)),onSave:async files=>window.fixture.saved=files}));

window.fixture={...engine,...text,...model,...layout,...graphics,...edits,...flow,PDFDocument,PDFName,PDFRawStream,decodePDFRawStream,sources,unsupportedSources,overflowSources,project:null,reopen};
reopen();
</script></body></html>
