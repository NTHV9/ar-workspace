<!doctype html><html><head><meta charset="utf-8"><title>Synthetic right header editing</title></head><body><div id="root"></div><details style="position:fixed;bottom:5px;right:5px;background:white;z-index:999;max-height:200px;overflow:auto;font:12px Arial"><summary>Header test evidence</summary><pre id="header-audit"></pre><a id="header-download" hidden>Download test PDF</a></details><script type="module">
import React from 'react';import {createRoot} from 'react-dom/client';
import {PdfWorkspace} from '/src/pdf/PdfWorkspace.tsx';
import {syntheticInvoice} from '/tests/browser/fixtures/invoice-pdf.ts';import {syntheticStatement} from '/tests/browser/fixtures/statement-pdf.ts';
import {mapSourceTextRect} from '/src/pdf/row-layout.ts';
import {loadSources,renderPage,detectText} from '/src/pdf/engine.ts';import {restoreProject} from '/src/pdf/model.ts';
const initialVoucher=new URLSearchParams(location.search).has('long')?'VCH-001-'+('0123456789'.repeat(6)):'VCH-001';
const docs=[{id:'statement',kind:'statement',name:'Statement.pdf',bytes:await syntheticStatement('KAT','Synthetic Guest',initialVoucher)},{id:'invoice',kind:'invoice',invoiceId:'B',name:'Inv. 88001.pdf',bytes:await syntheticInvoice(25,initialVoucher,'B',true)}];
async function audit(project){const loaded=await loadSources(docs);try{const copy=restoreProject(project,loaded.project,docs),results=[];for(const p of copy.pages.filter(p=>p.sourceId==='invoice')){const original=loaded.project.pages.find(v=>v.id===p.id),a=document.createElement('canvas'),b=document.createElement('canvas');await renderPage(original,loaded.documents,a,1.5);try{await renderPage(p,loaded.documents,b,1.5);}catch(e){document.getElementById('header-audit').textContent=JSON.stringify({error:e.message,layer:p.layers.find(l=>l.id===e.layerId)?.original},null,2);throw e;}const aa=a.getContext('2d').getImageData(0,0,a.width,a.height).data,bb=b.getContext('2d').getImageData(0,0,b.width,b.height).data;let changed=0;for(let y=120;y<390;y++)for(let x=0;x<495;x++){const i=(y*a.width+x)*4;if(Math.abs(aa[i]-bb[i])+Math.abs(aa[i+1]-bb[i+1])+Math.abs(aa[i+2]-bb[i+2])>30)changed++;}const text=await detectText(original,loaded.documents);results.push({page:p.id,leftChangedPixels:changed,roomLabelY:mapSourceTextRect(text.find(r=>r.text==='Room No.'),p.rowEdits??[])?.y,roomValueY:mapSourceTextRect(text.find(r=>r.text==='101'),p.rowEdits??[])?.y,voucher:p.layers.find(l=>l.original?.text===initialVoucher)?.text});}document.getElementById('header-audit').textContent=JSON.stringify({results,linkedVoucherTexts:copy.pages.flatMap(p=>p.layers.filter(l=>l.original?.text===initialVoucher).map(l=>l.text))},null,2);}finally{loaded.dispose();}}
createRoot(document.getElementById('root')).render(React.createElement(PdfWorkspace,{documents:docs,accountName:'Synthetic header scope',hotel:'KAT',selectedCount:1,onClose:()=>{},onSaveDraft:audit,onSave:async(files,project)=>{await audit(project);const link=document.getElementById('header-download');link.href=URL.createObjectURL(new Blob([files[0].bytes],{type:'application/pdf'}));link.download='Synthetic right header.pdf';link.hidden=false;}}));
</script></body></html>
