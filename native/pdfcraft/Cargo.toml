[package]
name = "ar-native-text"
version = "0.1.0"
edition = "2024"
publish = false
[lib]
crate-type = ["cdylib", "rlib"]
[workspace]
resolver = "3"
[dependencies]
wasm-bindgen = "=0.2.129"
serde_json = "1"
pdfcraft-cos = { path = "../upstream/crates/cos" }
pdfcraft-edit = { path = "../upstream/crates/edit" }
pdfcraft-model = { path = "../upstream/crates/model" }
pdfcraft-content = { path = "../upstream/crates/content" }
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
